<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Share Cards — The Slayers</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0A0A0A;color:#FFF;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;padding:20px 16px 40px}
.header{text-align:center;margin:10px 0 20px;width:100%;max-width:420px}
.header h1{font-size:12px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#C7FF38;margin-bottom:3px}
.header p{font-size:10px;color:#5F5F5F}
.picker-wrap{width:100%;max-width:420px;margin-bottom:18px}
.picker-scroll{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}
.picker-scroll::-webkit-scrollbar{display:none}
.picker-btn{flex-shrink:0;border:0.5px solid rgba(255,255,255,0.08);border-radius:99px;padding:7px 16px;font-size:9px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:#5F5F5F;transition:all .25s;white-space:nowrap}
.picker-btn.active{background:rgba(199,255,56,0.1);border-color:rgba(199,255,56,0.2);color:#C7FF38}
.card-stage{width:100%;display:flex;justify-content:center;margin-bottom:16px}
.card-inner{animation:fadeSlide 0.4s cubic-bezier(.16,1,.3,1);display:flex;justify-content:center}
@keyframes fadeSlide{from{opacity:0;transform:translateY(16px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.share-card{background:#111111;border-radius:24px;border:1px solid rgba(255,255,255,0.06);overflow:hidden;position:relative}
.size-sq{width:360px;height:360px}
.size-16-9{width:420px;height:236px}
.size-9-16{width:296px;height:526px}

.actions{display:flex;gap:8px;margin-top:8px;width:100%;max-width:420px}
.actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:13px 0;border-radius:14px;border:none;font-size:10px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s}
.actions button:active{transform:scale(0.97)}
.btn-primary{background:#C7FF38;color:#090909;box-shadow:0 0 20px rgba(199,255,56,0.1)}
.btn-secondary{background:rgba(255,255,255,0.04);color:#FFF;border:0.5px solid rgba(255,255,255,0.06)}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(80px);background:#1A1A1A;border:0.5px solid rgba(255,255,255,0.08);border-radius:99px;padding:10px 20px;font-size:10px;color:#FFF;opacity:0;transition:all 0.4s cubic-bezier(.16,1,.3,1);pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="header">
  <h1>The Slayers</h1>
  <p>Share your trade</p>
</div>

<div class="picker-wrap">
  <div class="picker-scroll" id="stylePicker">
    <button class="picker-btn active" data-style="hero">Hero</button>
    <button class="picker-btn" data-style="certificate">Certificate</button>
    <button class="picker-btn" data-style="story">Story</button>
    <button class="picker-btn" data-style="ticket">Ticket</button>
    <button class="picker-btn" data-style="minimal">Minimal</button>
    <button class="picker-btn" data-style="poster">Poster</button>
  </div>
</div>

<div class="card-stage">
  <div class="card-inner" id="cardInner"></div>
</div>

<div class="actions">
  <button class="btn-primary" onclick="shareCard()">Share</button>
  <button class="btn-secondary" onclick="saveCard()">Save</button>
</div>

<div class="toast" id="toast">Saved!</div>

<script>
var trade={
  pair:'XAU/USD',
  direction:'BUY',
  rNum:2.54,
  outcome:'WIN',
  risk:'1R',
  duration:'3h 24m',
  entry:'112,432.50',
  exit:'114,981.00',
  criteria:['Liquidity Sweep','Displacement','MSS','FVG at QM'],
  notes:'Discipline. Patience. Execution. — The Slayers way.',
  date:'25 Jul 2026',
  tradeNum:241,
  method:'QMR',
  logged:'Auto Logged'
};
var IMG='mascot.PNG';
var currentStyle='hero';

function fmtR(n){return (n>=0?'+':'')+Math.abs(n).toFixed(2)+'R';}

// ===== SVG Barcode =====
function barcodeSVG(){
  // Generate a fake premium barcode pattern
  var bars='';
  for(var i=0;i<36;i++){
    var h=12+Math.floor(Math.random()*20);
    bars+='<rect x="'+(i*3)+'" y="'+(28-h)+'" width="2" height="'+h+'" fill="rgba(255,255,255,0.15)" rx="0.5"/>';
  }
  return '<svg width="108" height="32" viewBox="0 0 108 32" style="display:block">'+bars+'</svg>';
}

// ===== BUILDER =====
function buildHero(){
  return '<div class="share-card size-sq" style="display:flex;flex-direction:column;padding:28px 24px 20px">'+
    // glow behind mascot only
    '<div style="position:absolute;top:20px;left:20px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(199,255,56,0.04) 0%,transparent 70%);pointer-events:none"></div>'+
    // top row: mascot + brand
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">'+
      '<div style="width:36px;height:36px;border-radius:99px;overflow:hidden;border:0.5px solid rgba(255,255,255,0.06);flex-shrink:0"><img src="'+IMG+'" style="width:100%;height:100%;object-fit:cover"></div>'+
      '<div>'+
        '<div style="font-size:7px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#5F5F5F;line-height:1.2">THE SLAYERS</div>'+
        '<div style="font-size:8px;font-weight:500;color:#5F5F5F;letter-spacing:0.03em">TRADE COMPLETED</div>'+
      '</div>'+
    '</div>'+
    // direction badge
    '<div style="display:inline-flex;align-items:center;gap:4px;font-size:7px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:rgba(199,255,56,0.08);border:0.5px solid rgba(199,255,56,0.12);color:#C7FF38;align-self:flex-start;margin-bottom:14px">'+trade.direction+'</div>'+
    // headline
    '<div style="font-size:15px;font-weight:800;color:#FFF;letter-spacing:-0.03em;margin-bottom:8px">NEW HIGH</div>'+
    // result — hero
    '<div style="font-size:52px;font-weight:900;letter-spacing:-0.04em;line-height:1;color:#C7FF38;margin-bottom:6px">'+fmtR(trade.rNum)+'</div>'+
    // pair + outcome
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:auto">'+
      '<span style="font-size:13px;font-weight:700;color:#FFF;letter-spacing:-0.02em">'+trade.pair+'</span>'+
      '<span style="display:inline-flex;align-items:center;gap:3px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;padding:2px 8px;border-radius:99px;background:rgba(199,255,56,0.1);color:#C7FF38">'+trade.outcome+'</span>'+
    '</div>'+
    // divider
    '<div style="width:100%;height:0.5px;background:rgba(255,255,255,0.05);margin:12px 0 10px"></div>'+
    // metrics row
    '<div style="display:flex;gap:24px">'+
      '<div><div style="font-size:7px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">Risk</div><div style="font-size:11px;font-weight:700;color:#FFF">'+trade.risk+'</div></div>'+
      '<div><div style="font-size:7px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">Duration</div><div style="font-size:11px;font-weight:700;color:#FFF">'+trade.duration+'</div></div>'+
      '<div><div style="font-size:7px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">Method</div><div style="font-size:11px;font-weight:700;color:#FFF">'+trade.method+'</div></div>'+
    '</div>'+
    // footer
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px">'+
      '<div style="font-size:8px;color:#5F5F5F;font-style:italic;letter-spacing:0.02em">"'+trade.notes.split(' — ')[0]+'."</div>'+
      '<div style="width:22px;height:22px;border-radius:99px;overflow:hidden;border:0.5px solid rgba(255,255,255,0.06);flex-shrink:0"><img src="'+IMG+'" style="width:100%;height:100%;object-fit:cover"></div>'+
    '</div>'+
  '</div>';
}

function buildCertificate(){
  return '<div class="share-card size-sq" style="display:flex;flex-direction:column;align-items:center;padding:32px 28px 24px;text-align:center">'+
    // corner accents
    '<div style="position:absolute;width:16px;height:16px;border-color:rgba(199,255,56,0.1);border-style:solid;border-width:1px 0 0 1px;border-radius:3px 0 0 0;top:14px;left:14px;pointer-events:none"></div>'+
    '<div style="position:absolute;width:16px;height:16px;border-color:rgba(199,255,56,0.1);border-style:solid;border-width:1px 1px 0 0;border-radius:0 3px 0 0;top:14px;right:14px;pointer-events:none"></div>'+
    '<div style="position:absolute;width:16px;height:16px;border-color:rgba(199,255,56,0.1);border-style:solid;border-width:0 0 1px 1px;border-radius:0 0 0 3px;bottom:14px;left:14px;pointer-events:none"></div>'+
    '<div style="position:absolute;width:16px;height:16px;border-color:rgba(199,255,56,0.1);border-style:solid;border-width:0 1px 1px 0;border-radius:0 0 3px 0;bottom:14px;right:14px;pointer-events:none"></div>'+
    // mascot centered
    '<div style="position:relative;width:56px;height:56px;margin-bottom:12px">'+
      '<div style="position:absolute;inset:-4px;border-radius:50%;border:0.5px solid rgba(199,255,56,0.08)"></div>'+
      '<div style="width:56px;height:56px;border-radius:50%;overflow:hidden;border:0.5px solid rgba(199,255,56,0.12)"><img src="'+IMG+'" style="width:100%;height:100%;object-fit:cover"></div>'+
    '</div>'+
    // brand
    '<div style="font-size:8px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#C7FF38;margin-bottom:2px">THE SLAYERS</div>'+
    '<div style="font-size:9px;font-weight:600;color:#5F5F5F;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:14px">CERTIFIED TRADE</div>'+
    // body
    '<div style="font-size:9px;color:#8E8E8E;margin-bottom:2px">This certifies that</div>'+
    '<div style="font-size:20px;font-weight:800;color:#FFF;letter-spacing:-0.03em;margin:4px 0">'+trade.pair+'</div>'+
    '<div style="font-size:9px;color:#8E8E8E;margin-bottom:2px">returned</div>'+
    '<div style="font-size:44px;font-weight:900;letter-spacing:-0.04em;line-height:1;color:#C7FF38;margin:6px 0">'+fmtR(trade.rNum)+'</div>'+
    '<div style="font-size:9px;color:#5F5F5F;margin-bottom:2px">using</div>'+
    '<div style="font-size:12px;font-weight:700;color:#FFF;letter-spacing:0.02em;margin-bottom:3px">'+trade.method+'</div>'+
    // divider
    '<div style="width:36px;height:0.5px;background:rgba(199,255,56,0.12);margin:12px auto 10px"></div>'+
    // date
    '<div style="font-size:8px;color:#5F5F5F;margin-bottom:auto">'+trade.date+'</div>'+
    // small logo bottom
    '<div style="display:flex;align-items:center;gap:5px;margin-top:4px">'+
      '<div style="width:14px;height:14px;border-radius:99px;overflow:hidden;border:0.5px solid rgba(255,255,255,0.06)"><img src="'+IMG+'" style="width:100%;height:100%;object-fit:cover"></div>'+
      '<span style="font-size:7px;font-weight:600;color:#5F5F5F;letter-spacing:0.12em;text-transform:uppercase">The Slayers</span>'+
    '</div>'+
  '</div>';
}

function buildStory(){
  return '<div class="share-card size-9-16" style="display:flex;flex-direction:column;overflow:hidden">'+
    // faded mascot background at 8%
    '<div style="position:absolute;inset:0;pointer-events:none"><img src="'+IMG+'" style="width:100%;height:100%;object-fit:cover;opacity:0.08"></div>'+
    // gradient overlay
    '<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.15) 0%,rgba(0,0,0,0.02) 40%,rgba(17,17,17,0.3) 70%,#111111 100%);pointer-events:none"></div>'+
    // content
    '<div style="position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center">'+
      // small mascot
      '<div style="width:48px;height:48px;border-radius:99px;overflow:hidden;border:0.5px solid rgba(255,255,255,0.06);margin-bottom:14px"><img src="'+IMG+'" style="width:100%;height:100%;object-fit:cover"></div>'+
      // label
      '<div style="font-size:8px;font-weight:600;color:#5F5F5F;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px">TRADE COMPLETED</div>'+
      // huge result
      '<div style="font-size:60px;font-weight:900;letter-spacing:-0.05em;line-height:1;color:#FFF;margin-bottom:4px"><span style="color:#C7FF38">+</span>'+trade.rNum.toFixed(2)+'<span style="font-size:28px;font-weight:700;color:#C7FF38">R</span></div>'+
      // pair
      '<div style="font-size:15px;font-weight:600;color:#8E8E8E;letter-spacing:0.02em;margin-bottom:10px">'+trade.pair+'</div>'+
      // status badge
      '<div style="display:inline-flex;align-items:center;gap:3px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;padding:3px 10px;border-radius:99px;background:rgba(199,255,56,0.08);border:0.5px solid rgba(199,255,56,0.12);color:#C7FF38">'+trade.outcome+'</div>'+
    '</div>'+
    // bottom info
    '<div style="position:relative;z-index:1;display:flex;justify-content:center;gap:28px;padding:14px 24px;border-top:0.5px solid rgba(255,255,255,0.04)">'+
      '<div style="text-align:center"><div style="font-size:7px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.06em">Risk</div><div style="font-size:10px;font-weight:700;color:#FFF;margin-top:2px">'+trade.risk+'</div></div>'+
      '<div style="text-align:center"><div style="font-size:7px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.06em">Method</div><div style="font-size:10px;font-weight:700;color:#FFF;margin-top:2px">'+trade.method+'</div></div>'+
      '<div style="text-align:center"><div style="font-size:7px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.06em">Date</div><div style="font-size:10px;font-weight:700;color:#FFF;margin-top:2px">'+trade.date.split(' ')[0]+'</div></div>'+
    '</div>'+
  '</div>';
}

function buildTicket(){
  return '<div class="share-card size-16-9" style="display:flex;overflow:hidden">'+
    // left panel
    '<div style="flex:1;padding:22px 20px;display:flex;flex-direction:column;position:relative">'+
      // soft glow left side
      '<div style="position:absolute;top:-40px;left:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(199,255,56,0.025) 0%,transparent 70%);pointer-events:none"></div>'+
      '<div style="position:relative;z-index:1;display:flex;flex-direction:column;height:100%">'+
        '<div style="font-size:6px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#5F5F5F;margin-bottom:8px">THE SLAYERS &bull; TRADE COMPLETED</div>'+
        '<div style="font-size:18px;font-weight:800;color:#FFF;letter-spacing:-0.03em;margin-bottom:4px">'+trade.pair+'</div>'+
        '<div style="font-size:32px;font-weight:900;letter-spacing:-0.04em;line-height:1;color:#C7FF38;margin-bottom:auto">'+fmtR(trade.rNum)+'</div>'+
        '<div style="font-size:8px;color:#5F5F5F;font-style:italic;letter-spacing:0.02em">"'+trade.notes.split(' — ')[0]+'."</div>'+
      '</div>'+
    '</div>'+
    // ticket cut-out
    '<div style="width:20px;display:flex;flex-direction:column;justify-content:space-between;padding:8px 0;flex-shrink:0">'+
      '<div style="width:20px;height:20px;border-radius:99px;background:#0A0A0A;flex-shrink:0"></div>'+
      '<div style="flex:1;width:2px;margin:0 auto;background:repeating-linear-gradient(180deg,rgba(255,255,255,0.05) 0,rgba(255,255,255,0.05) 4px,transparent 4px,transparent 8px)"></div>'+
      '<div style="width:20px;height:20px;border-radius:99px;background:#0A0A0A;flex-shrink:0"></div>'+
    '</div>'+
    // right panel
    '<div style="width:140px;padding:22px 16px;display:flex;flex-direction:column;flex-shrink:0">'+
      '<div style="font-size:7px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">Risk</div>'+
      '<div style="font-size:13px;font-weight:700;color:#FFF;margin-bottom:10px">'+trade.risk+'</div>'+
      '<div style="font-size:7px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">Method</div>'+
      '<div style="font-size:13px;font-weight:700;color:#FFF;margin-bottom:10px">'+trade.method+'</div>'+
      '<div style="font-size:7px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px">Date</div>'+
      '<div style="font-size:13px;font-weight:700;color:#FFF;margin-bottom:auto">'+trade.date+'</div>'+
      // barcode
      '<div style="align-self:flex-end;margin-top:4px">'+barcodeSVG()+'</div>'+
    '</div>'+
  '</div>';
}

function buildMinimal(){
  return '<div class="share-card size-sq" style="display:flex;flex-direction:column;align-items:center;padding:40px 32px;text-align:center">'+
    // top brand
    '<div style="font-size:7px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#5F5F5F;margin-bottom:auto;padding-top:12px">THE SLAYERS</div>'+
    // huge result
    '<div style="font-size:64px;font-weight:200;letter-spacing:-0.06em;line-height:1;color:#FFF;margin-bottom:4px"><span style="font-weight:200;color:#C7FF38">+</span>'+trade.rNum.toFixed(2)+'R</div>'+
    // pair
    '<div style="font-size:14px;font-weight:400;color:#5F5F5F;letter-spacing:0.02em;margin-bottom:10px">'+trade.pair+'</div>'+
    // badge
    '<div style="display:inline-flex;align-items:center;gap:3px;font-size:8px;font-weight:600;color:#C7FF38;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:auto">'+trade.outcome+'</div>'+
    // divider
    '<div style="width:24px;height:0.5px;background:rgba(255,255,255,0.06);margin:0 auto 16px"></div>'+
    // bottom meta
    '<div style="display:flex;gap:28px;margin-bottom:12px">'+
      '<div><div style="font-size:7px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px">Status</div><div style="font-size:10px;font-weight:500;color:#8E8E8E">'+trade.logged+'</div></div>'+
      '<div><div style="font-size:7px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px">Date</div><div style="font-size:10px;font-weight:500;color:#8E8E8E">'+trade.date+'</div></div>'+
    '</div>'+
    // small logo
    '<div style="display:flex;align-items:center;gap:5px">'+
      '<div style="width:14px;height:14px;border-radius:99px;overflow:hidden;border:0.5px solid rgba(255,255,255,0.06)"><img src="'+IMG+'" style="width:100%;height:100%;object-fit:cover"></div>'+
      '<span style="font-size:7px;font-weight:600;color:#5F5F5F;letter-spacing:0.12em;text-transform:uppercase">The Slayers</span>'+
    '</div>'+
  '</div>';
}

function buildPoster(){
  return '<div class="share-card size-9-16" style="display:flex;flex-direction:column;overflow:hidden;background:#0E0E0E">'+
    // large circular halo behind mascot
    '<div style="position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(199,255,56,0.025) 0%,rgba(199,255,56,0.008) 40%,transparent 70%);pointer-events:none"></div>'+
    // mascot — dominates ~70% of height
    '<div style="position:absolute;top:0;left:0;right:0;height:70%;pointer-events:none">'+
      '<img src="'+IMG+'" style="width:100%;height:100%;object-fit:cover;opacity:0.6">'+
    '</div>'+
    // gradient to blend mascot into dark
    '<div style="position:absolute;top:50%;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent 0%,#0E0E0E 50%);pointer-events:none"></div>'+
    // green smoke around shoulders
    '<div style="position:absolute;top:40%;left:50%;transform:translateX(-50%);width:240px;height:200px;background:radial-gradient(ellipse at center,rgba(199,255,56,0.03) 0%,transparent 60%);pointer-events:none"></div>'+
    // content
    '<div style="position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px 28px;text-align:center">'+
      // result
      '<div style="font-size:52px;font-weight:900;letter-spacing:-0.05em;line-height:1;color:#FFF;margin-bottom:2px"><span style="color:#C7FF38">+</span>'+trade.rNum.toFixed(2)+'<span style="font-size:24px;font-weight:700;color:#C7FF38">R</span></div>'+
      // pair
      '<div style="font-size:13px;font-weight:600;color:#8E8E8E;letter-spacing:0.02em;margin-bottom:8px">'+trade.pair+'</div>'+
      // badge
      '<div style="display:inline-flex;align-items:center;gap:3px;font-size:7px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;padding:3px 10px;border-radius:99px;background:rgba(199,255,56,0.08);border:0.5px solid rgba(199,255,56,0.12);color:#C7FF38;margin-bottom:20px">'+trade.outcome+'</div>'+
      // date
      '<div style="font-size:8px;color:#5F5F5F;margin-bottom:2px">'+trade.date+'</div>'+
      // brand
      '<div style="font-size:7px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#5F5F5F">THE SLAYERS</div>'+
    '</div>'+
  '</div>';
}

var builders={hero:buildHero,certificate:buildCertificate,story:buildStory,ticket:buildTicket,minimal:buildMinimal,poster:buildPoster};

function render(style){
  currentStyle=style||currentStyle;
  var el=document.getElementById('cardInner');
  el.style.animation='none';
  void el.offsetHeight;
  el.style.animation='fadeSlide 0.4s cubic-bezier(.16,1,.3,1)';
  el.innerHTML=builders[currentStyle]();
  var btns=document.querySelectorAll('.picker-btn');
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle('active',btns[i].dataset.style===currentStyle);
}

document.getElementById('stylePicker').addEventListener('click',function(e){
  var btn=e.target.closest('.picker-btn');
  if(!btn)return;
  render(btn.dataset.style);
});

function shareCard(){showToast('Share card ready!');}
function saveCard(){showToast('Saved!');}
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout=setTimeout(function(){t.classList.remove('show');},2000);
}

render('hero');
</script>
</body>
</html>
