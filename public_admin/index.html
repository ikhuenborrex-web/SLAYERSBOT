<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slayers Ops Center</title>
<meta name="robots" content="noindex, nofollow">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080c10;--panel:#0c1218;--border:#1e2530;--mint:#26A69A;--mintDim:#1a4a44;--gold:#F5A623;--red:#F3677A;--white:#c8d8e8;--dim:#4a6a7a;--radius:12px}
body{background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;min-height:100vh}
input,select,button{font-family:inherit;font-size:14px}
input{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--white);outline:none;width:100%}
input:focus{border-color:var(--mint)}
button{cursor:pointer;border:none;border-radius:8px;padding:10px 16px;font-weight:600;transition:all .15s}
button:active{transform:scale(.97)}
.btn-primary{background:var(--mint);color:#000}
.btn-primary:hover{background:#2dbdb0}
.btn-danger{background:var(--red);color:#000}
.btn-danger:hover{background:#e5556a}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--white)}
.btn-ghost:hover{background:var(--panel)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-gold{background:var(--gold);color:#000}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
label{display:block;color:var(--dim);font-size:12px;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
select{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--white);outline:none;width:100%}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.status-dot.live{background:#4ade80;box-shadow:0 0 6px #4ade8066}
.status-dot.warn{background:var(--gold);box-shadow:0 0 6px #F5A62366}
.status-dot.dead{background:var(--red);box-shadow:0 0 6px #F3677A66}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card .value{font-size:28px;font-weight:800;color:var(--white);line-height:1.2}
.stat-card .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.stat-card .sub{font-size:11px;color:var(--mint);margin-top:2px}
.stat-card.green .value{color:var(--mint)}
.stat-card.gold .value{color:var(--gold)}
.stat-card.red .value{color:var(--red)}
.stat-card.blue .value{color:#60a5fa}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 10px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:rgba(38,166,154,.04)}
.bull{color:#4ade80}
.bear{color:var(--red)}
.neutral{color:var(--gold)}
.mint{color:var(--mint)}
.dim{color:var(--dim)}
.gold{color:var(--gold)}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--panel);border-right:1px solid var(--border);padding:20px 0;z-index:10;display:flex;flex-direction:column}
.sidebar .brand{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:12px}
.sidebar .brand h1{font-size:16px;font-weight:900;text-transform:uppercase;color:var(--white);letter-spacing:1px}
.sidebar .brand .sub{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.sidebar nav{flex:1;overflow-y:auto}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--dim);text-decoration:none;font-size:13px;font-weight:600;transition:all .15s;border-left:3px solid transparent}
.sidebar nav a:hover{color:var(--white);background:rgba(38,166,154,.06)}
.sidebar nav a.active{color:var(--mint);border-left-color:var(--mint);background:rgba(38,166,154,.08)}
.sidebar nav a .icon{width:18px;text-align:center;font-size:16px}
.sidebar .footer{padding:16px 20px;border-top:1px solid var(--border)}
.main{margin-left:220px;min-height:100vh;padding:24px 32px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.topbar h2{font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:24px}
.section-title{font-size:13px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.toast{position:fixed;top:20px;right:20px;z-index:100;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;animation:slideIn .2s ease;max-width:360px}
.toast.success{background:#1a4a44;border:1px solid var(--mint);color:var(--mint)}
.toast.error{background:#4a1a24;border:1px solid var(--red);color:var(--red)}
.toast.info{background:#1a2a4a;border:1px solid #3b82f6;color:#60a5fa}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px;max-width:440px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:800;margin-bottom:8px}
.modal p{color:var(--dim);font-size:13px;margin-bottom:16px;line-height:1.5}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.log-line{padding:6px 0;border-bottom:1px solid var(--border);font-family:monospace;font-size:12px;display:flex;gap:12px;align-items:flex-start}
.log-line .time{color:var(--dim);white-space:nowrap;min-width:70px}
.log-line .sev{font-weight:700;min-width:50px}
.log-line .sev.info{color:#60a5fa}
.log-line .sev.warn{color:var(--gold)}
.log-line .sev.error{color:var(--red)}
.log-line .sev.success{color:var(--mint)}
.log-line .msg{color:var(--white);word-break:break-word}
.empty-state{padding:40px 20px;text-align:center;color:var(--dim);font-size:14px}
@media(max-width:768px){
  .sidebar{width:56px}
  .sidebar .brand h1,.sidebar .brand .sub,.sidebar nav a span,.sidebar .footer{display:none}
  .sidebar nav a{padding:12px;justify-content:center;border-left:none;border-bottom:2px solid transparent}
  .sidebar nav a.active{border-left:none;border-bottom-color:var(--mint)}
  .main{margin-left:56px;padding:16px}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-2{grid-template-columns:1fr}
  .topbar{flex-direction:column;align-items:flex-start;gap:12px}
  table{font-size:12px}
  th,td{padding:6px 8px}
}
@media(max-width:480px){
  .grid-4{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
