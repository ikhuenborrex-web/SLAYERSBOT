<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slayers — Admin Control Center</title>
<meta name="robots" content="noindex, nofollow">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#090909;--surface:#151515;--surface2:#1a1a1a;
  --border:rgba(255,255,255,0.06);--border-light:rgba(255,255,255,0.1);
  --accent:#B8FF2C;--accent-glow:rgba(184,255,44,0.15);
  --text:#FFFFFF;--text2:#888888;--text3:#555555;
  --red:#FF4444;--green:#4ADE80;--orange:#FFA726;--blue:#42A5F5;
  --radius:10px;--radius-sm:6px;--radius-lg:16px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --font:system-ui,-apple-system,'Inter','SF Pro',Helvetica,Arial,sans-serif;
  --mono:'SF Mono','Fira Code','Consolas',monospace;
  --sidebar:260px;
}
html{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#000}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--text3);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--text2)}
input,textarea,select,button{font-family:var(--font);font-size:13px;outline:none}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);width:100%;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
button{cursor:pointer;border:none;border-radius:var(--radius-sm);padding:9px 16px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{box-shadow:0 0 20px var(--accent-glow)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface);border-color:var(--text3)}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-ghost:hover{color:var(--text);background:rgba(255,255,255,.04)}
.btn-danger{background:var(--red);color:#000}
.btn-sm{padding:6px 12px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);transition:border .2s}
.card:hover{border-color:var(--border-light)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;gap:4px}
.badge-green{background:rgba(74,222,128,.12);color:var(--green)}
.badge-red{background:rgba(255,68,68,.12);color:var(--red)}
.badge-orange{background:rgba(255,167,38,.12);color:var(--orange)}
.badge-neutral{background:rgba(255,255,255,.06);color:var(--text2)}
.text-green{color:var(--green)}
.text-red{color:var(--red)}
.text-accent{color:var(--accent)}
.text-muted{color:var(--text2)}
.text-muted2{color:var(--text3)}
.text-sm{font-size:12px}
.text-xs{font-size:11px}
.mono{font-family:var(--mono)}
.flex{display:flex}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.items-center{align-items:center}
.justify-between{justify-content:space-between}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== LAYOUT ===== */
#app{display:flex;height:100vh;overflow:hidden}

.sidebar{width:var(--sidebar);min-width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10}
.sidebar-brand{padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.sidebar-brand .logo{font-size:18px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--text)}
.sidebar-brand .logo span{color:var(--accent)}
.sidebar-brand .tagline{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 0}
.sidebar-group{padding:0 12px;margin-bottom:16px}
.sidebar-group .group-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;padding:8px 8px 6px;font-weight:700}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--text2);text-decoration:none;font-size:13px;font-weight:500;transition:all .15s;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.sidebar-item:hover{color:var(--text);background:rgba(255,255,255,.04)}
.sidebar-item.active{color:var(--accent);background:var(--accent-glow);font-weight:600}
.sidebar-item .icon{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sidebar-item .icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sidebar-footer{margin-top:auto;padding:16px 12px;border-top:1px solid var(--border)}
.bot-status{background:var(--surface2);border-radius:var(--radius-sm);padding:12px;display:flex;align-items:center;gap:10px}
.bot-status .ring{position:relative;width:32px;height:32px;flex-shrink:0}
.bot-status .ring svg{transform:rotate(-90deg)}
.bot-status .ring .track{fill:none;stroke:var(--border);stroke-width:3}
.bot-status .ring .arc{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:88;stroke-dashoffset:0;stroke-linecap:round;transition:stroke-dashoffset 1s}
.bot-status .ring .dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.bot-status .info .name{font-size:11px;font-weight:600;color:var(--text)}
.bot-status .info .uptime{font-size:10px;color:var(--text3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);flex-shrink:0;min-height:57px}
.topbar-left{display:flex;align-items:center;gap:16px}
.topbar-left h2{font-size:16px;font-weight:700;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:12px}
.status-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.status-indicator .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.topbar-profile{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--surface2);border:1px solid var(--border)}
.topbar-profile .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.topbar-profile .name{font-size:12px;font-weight:600;color:var(--text)}
.topbar-profile .role{font-size:10px;color:var(--text3)}

.content{flex:1;overflow-y:auto;padding:24px 28px 40px;min-height:0}

/* ===== KPI ROW ===== */
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:24px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px;transition:border .2s}
.kpi-card:hover{border-color:var(--border-light)}
.kpi-card .kpi-header{display:flex;align-items:center;justify-content:space-between}
.kpi-card .kpi-icon{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--surface2);display:flex;align-items:center;justify-content:center}
.kpi-card .kpi-icon svg{width:14px;height:14px;stroke:var(--text2);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.kpi-card .kpi-badge{font-size:10px;padding:2px 6px;border-radius:99px;font-weight:600}
.kpi-card .kpi-value{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1}
.kpi-card .kpi-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.kpi-card .kpi-sparkline{height:28px;margin-top:4px}
.kpi-card .kpi-sparkline svg{width:100%;height:100%}

/* ===== DASHBOARD GRID ===== */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.dash-grid .span-2{grid-column:1/-1}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0;margin-bottom:12px}
.card-header h3{font-size:13px;font-weight:600;color:var(--text)}
.card-header .action{color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:4px;font-size:12px;font-weight:500;background:none;border:none;padding:4px}
.card-header .action:hover{color:var(--accent)}
.card-body{padding:0 18px 18px}

/* ===== SYSTEM STATUS ===== */
.system-status{display:flex;gap:24px;align-items:center;padding:18px}
.system-ring{position:relative;width:80px;height:80px;flex-shrink:0}
.system-ring svg{transform:rotate(-90deg)}
.system-ring .track{fill:none;stroke:var(--border);stroke-width:4}
.system-ring .arc{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:226;stroke-dashoffset:0;transition:stroke-dashoffset 1.5s}
.system-ring .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.system-ring .center .num{font-size:20px;font-weight:700;color:var(--accent)}
.system-ring .center .lbl{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:-2px}
.services-list{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.service-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius-sm);background:var(--surface2);font-size:12px}
.service-item .s-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.service-item .s-dot.running{background:var(--green);box-shadow:0 0 6px rgba(74,222,128,.4)}
.service-item .s-dot.warning{background:var(--orange);box-shadow:0 0 6px rgba(255,167,38,.4)}
.service-item .s-dot.offline{background:var(--red);box-shadow:0 0 6px rgba(255,68,68,.4)}
.service-item .s-name{color:var(--text2);flex:1}
.service-item .s-status{font-size:10px;font-weight:600}

/* ===== SCANNER WIDGET ===== */
.scanner-widget{padding:18px;display:flex;flex-direction:column;gap:12px}
.scanner-row{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.scanner-row .lbl{color:var(--text3)}
.scanner-row .val{color:var(--text);font-weight:600;font-family:var(--mono)}
.scanner-progress{height:3px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:4px}
.scanner-progress .bar{height:100%;background:var(--accent);border-radius:99px;transition:width .5s;width:0%}

/* ===== ACTIVITY FEED ===== */
.activity-feed{max-height:280px;overflow-y:auto}
.activity-item{display:flex;align-items:flex-start;gap:10px;padding:8px 18px;border-bottom:1px solid var(--border);font-size:12px;animation:feedIn .3s ease}
.activity-item:last-child{border-bottom:none}
.activity-item .a-dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0}
.activity-item .a-body{flex:1;min-width:0}
.activity-item .a-title{color:var(--text);font-weight:500}
.activity-item .a-time{color:var(--text3);font-size:10px;white-space:nowrap;margin-left:8px}
@keyframes feedIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* ===== SIGNALS TABLE ===== */
.compact-table{width:100%;border-collapse:collapse;font-size:12px}
.compact-table th{padding:8px 10px;text-align:left;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;border-bottom:1px solid var(--border)}
.compact-table td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.compact-table tr:last-child td{border-bottom:none}
.compact-table tr:hover td{background:rgba(255,255,255,.02)}
.status-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600}
.status-badge.published{background:rgba(184,255,44,.12);color:var(--accent)}
.status-badge.pending{background:rgba(255,167,38,.12);color:var(--orange)}
.status-badge.closed{background:rgba(136,136,136,.12);color:var(--text2)}
.status-badge.cancelled{background:rgba(255,68,68,.12);color:var(--red)}

/* ===== AI INSIGHT ===== */
.ai-card{padding:18px}
.ai-summary{font-size:13px;line-height:1.6;color:var(--text2)}
.ai-chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ai-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);font-size:12px;font-weight:500}
.ai-chip .chip-dot{width:6px;height:6px;border-radius:50%}
.ai-chip .chip-dot.bull{background:var(--accent)}
.ai-chip .chip-dot.bear{background:var(--red)}
.ai-chip .chip-dot.neutral{background:var(--text3)}

/* ===== CHART ===== */
.chart-container{height:160px;padding:8px 0;position:relative}
.chart-container svg{width:100%;height:100%}
.chart-container .chart-path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart-container .chart-area{fill:url(#chartGradient);opacity:.15}
.chart-container .chart-grid-line{stroke:var(--border);stroke-width:.5}
.chart-periods{display:flex;gap:4px;margin-bottom:8px}
.chart-period{font-size:11px;padding:4px 10px;border-radius:99px;background:transparent;border:1px solid var(--border);color:var(--text3);cursor:pointer;transition:all .15s}
.chart-period:hover{color:var(--text)}
.chart-period.active{background:var(--accent);color:#000;border-color:var(--accent)}

/* ===== QUICK ACTIONS ===== */
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:18px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border);color:var(--text2);font-size:11px;font-weight:500;transition:all .15s;cursor:pointer;text-align:center}
.quick-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.quick-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ===== TOP MARKETS ===== */
.top-market-row{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;border-bottom:1px solid var(--border);font-size:12px}
.top-market-row:last-child{border-bottom:none}
.top-market-row .pair{font-weight:600;color:var(--text)}
.top-market-row .pair .rank{color:var(--text3);margin-right:8px;font-weight:400}
.top-market-row .stat{text-align:right}
.top-market-row .stat .val{font-weight:600;font-family:var(--mono)}
.top-market-row .stat .lbl{font-size:10px;color:var(--text3)}

/* ===== RESPONSIVE ===== */
@media(max-width:1200px){
  .kpi-row{grid-template-columns:repeat(3,1fr)}
  .dash-grid{grid-template-columns:1fr}
  .services-list{grid-template-columns:1fr}
  .quick-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){
  :root{--sidebar:200px}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .system-status{flex-direction:column;align-items:flex-start}
  .topbar{padding:12px 16px}
  .content{padding:16px}
}
@media(max-width:640px){
  :root{--sidebar:0px}
  .sidebar{position:fixed;left:-260px;transition:left .3s;z-index:100}
  .sidebar.open{left:0}
  .main{margin-left:0}
  .kpi-row{grid-template-columns:1fr 1fr}
  .quick-grid{grid-template-columns:1fr 1fr}
  .mobile-menu-btn{display:flex!important}
}
.mobile-menu-btn{display:none;background:none;border:none;color:var(--text2);padding:4px;cursor:pointer}

/* ===== TOASTS ===== */
.toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;animation:toastIn .25s ease;border:1px solid;pointer-events:auto}
.toast.success{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.2);color:var(--green)}
.toast.error{background:rgba(255,68,68,.08);border-color:rgba(255,68,68,.2);color:var(--red)}
.toast.info{background:rgba(66,165,245,.08);border-color:rgba(66,165,245,.2);color:var(--blue)}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;max-width:420px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:700;margin-bottom:6px}
.modal p{color:var(--text2);font-size:13px;margin-bottom:16px;line-height:1.5}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===== COUNTER ===== */
.count-up{display:inline-block;transition:all .3s}

/* ===== LOGIN ===== */
.login-page{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(ellipse at 50% 0%, rgba(184,255,44,.03) 0%, transparent 60%)}
.login-box{max-width:360px;width:100%;padding:20px}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .main{font-size:26px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--text)}
.login-logo .main span{color:var(--accent)}
.login-logo .sub{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;margin-top:4px}

/* ===== TRADES PAGE ===== */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.section-header h2{font-size:18px;font-weight:700}
.empty-state{padding:48px 20px;text-align:center;color:var(--text3);font-size:13px}

/* ===== SUBSCRIBERS ===== */
.sub-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.sub-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.sub-stat .num{font-size:28px;font-weight:800;line-height:1}
.sub-stat .lbl{font-size:9px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-top:4px}
.sub-controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sub-search{flex:1;min-width:160px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;color:var(--text);font-size:13px;outline:none}
.sub-search::placeholder{color:var(--text3)}
.sub-filters{display:flex;gap:6px;flex-wrap:wrap}
.sub-fbtn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;font-size:11px;letter-spacing:.5px;color:var(--text2);cursor:pointer;transition:all .2s}
.sub-fbtn.active{background:var(--accent);color:#000;border-color:var(--accent)}
.sub-fbtn:hover{color:var(--text)}
.sub-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sub-card:hover{border-color:var(--border-light)}
.sub-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0}
.sub-info{flex:1;min-width:120px}
.sub-info .name{font-weight:600;font-size:13px}
.sub-info .tg{font-size:11px;color:var(--text2)}
.sub-info .note{font-size:10px;color:var(--text3);margin-top:2px}
.sub-plan{font-size:10px;padding:3px 10px;border-radius:99px;letter-spacing:.5px;white-space:nowrap;font-weight:600}
.sub-dates{text-align:center;min-width:100px}
.sub-dates .paid{font-size:11px;color:var(--text2)}
.sub-dates .exp{font-size:11px;margin-top:2px}
.sub-actions{display:flex;gap:5px;flex-wrap:wrap}
.sub-banner{border-radius:var(--radius);padding:10px 14px;margin-bottom:10px;font-size:12px;display:none}
.sub-banner.show{display:block}
.sub-banner-warn{background:rgba(255,167,38,.06);border:1px solid rgba(255,167,38,.2);border-left:3px solid var(--orange);color:var(--orange)}
.sub-banner-err{background:rgba(255,68,68,.06);border:1px solid rgba(255,68,68,.2);border-left:3px solid var(--red);color:var(--red)}
