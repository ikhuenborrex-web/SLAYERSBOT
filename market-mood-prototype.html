<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Global Market Mood — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#090909;color:#FFF;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;max-width:420px;margin:0 auto;padding:20px 0 40px}

.label{font-size:11px;font-weight:700;color:#FFF;letter-spacing:-0.02em;margin-bottom:2px;padding:0 16px}
.sub{font-size:9px;color:#5F5F5F;margin-bottom:14px;padding:0 16px}

.scroll-wrap{overflow-x:auto;scrollbar-width:none;padding:4px 16px 8px;-webkit-overflow-scrolling:touch}
.scroll-wrap::-webkit-scrollbar{display:none}
.scroll{display:flex;gap:12px}

.card{flex-shrink:0;width:88px;height:108px;border-radius:18px;padding:10px 8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;transition:all .3s cubic-bezier(.16,1,.3,1);background:rgba(20,20,20,.92);border:0.5px solid rgba(255,255,255,.05);box-shadow:0 12px 24px rgba(0,0,0,.25);position:relative;overflow:hidden}
.card:active{transform:translateY(-3px) scale(1.02);box-shadow:0 16px 32px rgba(0,0,0,.35)}
.card.open{transform:translateY(-3px) scale(1.02)}

.icon-wrap{position:relative;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex-shrink:0}
.icon-wrap svg{width:22px;height:22px;position:relative;z-index:1}

/* Strength Ring */
.ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,0.04);stroke-width:2.5}
.ring-fill{fill:none;stroke-width:2.5;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.16,1,.3,1)}

.arrow{font-size:13px;line-height:1;margin-top:1px}
.status{font-size:9px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;line-height:1.2}
.conviction{font-size:7px;font-weight:500;letter-spacing:0.02em;line-height:1;margin-top:1px}

/* Confidence Meter */
.meter{width:100%;height:2.5px;border-radius:99px;background:rgba(255,255,255,0.04);overflow:hidden;margin-top:3px}
.meter-fill{height:100%;border-radius:99px;transition:width 1s cubic-bezier(.16,1,.3,1)}

/* Animations */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:0.5}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes rotate{0%,100%{transform:rotate(0deg)}50%{transform:rotate(4deg)}}
@keyframes grow{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.08)}}
.anim-float{animation:float 5s ease-in-out infinite}
.anim-shimmer{animation:shimmer 4s ease-in-out infinite}
.anim-pulse{animation:pulse 4s ease-in-out infinite}
.anim-rotate{animation:rotate 6s ease-in-out infinite}
.anim-grow{animation:grow 4.5s ease-in-out infinite}
.anim-grow-reverse{animation:grow 4.5s ease-in-out infinite;animation-direction:reverse}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{width:100%;max-width:420px;background:#0E0E0E;border-radius:28px 28px 0 0;border:0.5px solid rgba(255,255,255,0.04);border-bottom:none;padding:24px 20px 32px;animation:slideUp .4s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.modal-handle{width:32px;height:3px;border-radius:99px;background:rgba(255,255,255,0.08);margin:0 auto 18px}
.modal-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modal-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:0.5px solid rgba(255,255,255,.08)}
.modal-icon svg{width:20px;height:20px}
.modal-title{font-size:16px;font-weight:700;color:#FFF;letter-spacing:-0.02em}
.modal-sub{font-size:9px;text-transform:uppercase}
.modal-section{margin-bottom:14px}
.modal-section-label{font-size:8px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.modal-driver{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,0.02);font-size:10px;color:#8E8E8E;margin-bottom:3px}
.modal-driver::before{content:'';width:4px;height:4px;border-radius:50%;background:#C7FF38;flex-shrink:0}
.modal-pair{display:flex;justify-content:space-between;padding:4px 0;font-size:10px;border-bottom:0.5px solid rgba(255,255,255,0.04)}
.modal-pair:last-child{border-bottom:none}
.modal-pair-name{font-weight:600;color:#FFF}
.modal-pair-dir{font-weight:500}
</style>
</head>
<body>

<div class="label">Global Market Mood</div>
<div class="sub">Real-time macro heatmap</div>

<div class="scroll-wrap">
  <div class="scroll" id="cardRow">
    <!-- Cards injected by JS -->
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-header" id="modalHeader"></div>
    <div class="modal-section">
      <div class="modal-section-label">Strength Score</div>
      <div style="display:flex;align-items:center;gap:10px">
        <div id="modalRingWrap" style="position:relative;width:48px;height:48px;flex-shrink:0">
          <svg viewBox="0 0 48 48" style="width:48px;height:48px;transform:rotate(-90deg)">
            <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="3"/>
            <circle id="modalRing" cx="24" cy="24" r="20" fill="none" stroke="#C7FF38" stroke-width="3" stroke-linecap="round" stroke-dasharray="125.6"/>
          </svg>
        </div>
        <div><div id="modalScore" style="font-size:24px;font-weight:800;color:#FFF;letter-spacing:-0.03em">92%</div><div style="font-size:8px;color:#5F5F5F">Strength</div></div>
      </div>
    </div>
    <div class="modal-section">
      <div class="modal-section-label">Drivers</div>
      <div id="modalDrivers"></div>
    </div>
    <div class="modal-section">
      <div class="modal-section-label">Affected Pairs</div>
      <div id="modalPairs"></div>
    </div>
    <div style="font-size:8px;color:#5F5F5F;margin-top:4px" id="modalUpdated"></div>
  </div>
</div>

<script>
// ===== ASSET DATA =====
var moodData=[
  {
    id:'usd',label:'USD',status:'Strong',dir:'bullish',score:92,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
    anim:'anim-pulse',
    drivers:['Higher Treasury Yields','Hawkish Fed','Risk-Off Sentiment'],
    pairs:[{n:'EUR/USD',d:'bearish'},{n:'GBP/USD',d:'bearish'},{n:'USD/JPY',d:'bullish'}]
  },
  {
    id:'eur',label:'EUR',status:'Weak',dir:'bearish',score:28,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14"/><path d="M7 8c0-2.2 1.8-4 4-4h2a4 4 0 0 1 0 8h-2"/><path d="M7 16c0 2.2 1.8 4 4 4h2a4 4 0 0 0 0-8h-2"/></svg>',
    anim:'anim-shimmer',
    drivers:['Weaker Eurozone PMI','ECB Dovish Pivot','Growth Concerns'],
    pairs:[{n:'EUR/USD',d:'bearish'},{n:'EUR/GBP',d:'bearish'},{n:'EUR/JPY',d:'bearish'}]
  },
  {
    id:'gold',label:'Gold',status:'Bearish',dir:'bearish',score:34,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg>',
    anim:'anim-shimmer',
    drivers:['Strong USD','Rising Real Yields','ETF Outflows'],
    pairs:[{n:'XAU/USD',d:'bearish'},{n:'XAG/USD',d:'bearish'},{n:'GOLD/FX',d:'bearish'}]
  },
  {
    id:'oil',label:'Oil',status:'Neutral',dir:'neutral',score:52,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L8 9h8L12 2z"/><path d="M8 9v9a3 3 0 0 0 3 3h2a3 3 0 0 0 3-3V9"/><path d="M6 18h12"/><path d="M9 14h6"/></svg>',
    anim:'anim-float',
    drivers:['OPEC+ Supply Cuts','China Demand Concerns','Geopolitical Premium'],
    pairs:[{n:'WTI Crude',d:'neutral'},{n:'Brent Crude',d:'neutral'},{n:'OIL/ETF',d:'neutral'}]
  },
  {
    id:'crypto',label:'Crypto',status:'Bullish',dir:'bullish',score:78,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
    anim:'anim-rotate',
    drivers:['BTC ETF Inflows','Regulatory Clarity','Institutional Adoption'],
    pairs:[{n:'BTC/USD',d:'bullish'},{n:'ETH/USD',d:'bullish'},{n:'SOL/USD',d:'bullish'}]
  },
  {
    id:'indices',label:'Indices',status:'Bullish',dir:'bullish',score:86,
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/><line x1="2" y1="20" x2="22" y2="20"/></svg>',
    anim:'anim-grow',
    drivers:['Tech Sector Momentum','Rate Cut Expectations','Earnings Beat'],
    pairs:[{n:'S&P 500',d:'bullish'},{n:'NASDAQ',d:'bullish'},{n:'Dow Jones',d:'bullish'}]
  }
];

var colors={bullish:'#B7FF2A',bearish:'#FF5D5D',neutral:'#FFC857'};

function renderCards(){
  var row=document.getElementById('cardRow');
  row.innerHTML='';
  moodData.forEach(function(d,i){
    var col=colors[d.dir];
    var arrow=d.dir==='bullish'?'↗':d.dir==='bearish'?'↘':'→';
    var circ=2*Math.PI*20; // r=20
    var offset=circ*(1-d.score/100);
    var card=document.createElement('div');
    card.className='card';
    card.style.animationDelay=(i*0.06)+'s';
    card.innerHTML=
      '<div class="icon-wrap">'+
        '<svg class="ring-svg" viewBox="0 0 48 48">'+
          '<circle class="ring-bg" cx="24" cy="24" r="20"/>'+
          '<circle class="ring-fill" stroke="'+col+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'" cx="24" cy="24" r="20"/>'+
        '</svg>'+
        '<div class="'+d.anim+'">'+d.icon+'</div>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;align-items:center;gap:0">'+
        '<div style="display:flex;align-items:center;gap:2px">'+
          '<span class="arrow" style="color:'+col+'">'+arrow+'</span>'+
          '<span class="status" style="color:'+col+'">'+d.status+'</span>'+
        '</div>'+
        '<span class="conviction" style="color:'+col+'">'+d.score+'%</span>'+
      '</div>'+
      '<div class="meter"><div class="meter-fill" style="width:'+d.score+'%;background:'+col+';box-shadow:0 0 6px '+col+'"></div></div>';
    card.addEventListener('click',function(){openModal(i);});
    row.appendChild(card);
  });
}

function openModal(idx){
  var d=moodData[idx];
  var col=colors[d.dir];
  var overlay=document.getElementById('modalOverlay');
  overlay.classList.add('open');

  var circ=2*Math.PI*20;
  var offset=circ*(1-d.score/100);
  document.getElementById('modalHeader').innerHTML=
    '<div class="modal-icon" style="border-color:'+col+'33">'+
      '<div style="width:20px;height:20px;color:'+col+'">'+d.icon+'</div>'+
    '</div>'+
    '<div><div class="modal-title">'+d.label+'</div><div class="modal-sub" style="color:'+col+'">'+d.status+' · '+d.score+'%</div></div>';

  document.getElementById('modalRing').setAttribute('stroke',col);
  document.getElementById('modalRing').setAttribute('stroke-dashoffset',offset);
  document.getElementById('modalScore').textContent=d.score+'%';
  document.getElementById('modalScore').style.color=col;

  document.getElementById('modalDrivers').innerHTML=d.drivers.map(function(dr){return '<div class="modal-driver">'+dr+'</div>';}).join('');

  document.getElementById('modalPairs').innerHTML=d.pairs.map(function(p){
    var pc=p.d==='bullish'?colors.bullish:p.d==='bearish'?colors.bearish:colors.neutral;
    return '<div class="modal-pair"><span class="modal-pair-name">'+p.n+'</span><span class="modal-pair-dir" style="color:'+pc+'">'+(p.d==='bullish'?'↑':p.d==='bearish'?'↓':'→')+'</span></div>';
  }).join('');

  document.getElementById('modalUpdated').textContent='Updated 3m ago';
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click',function(e){
  if(e.target===this)this.classList.remove('open');
});

renderCards();
</script>
</body>
</html>
