<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden;width:100vw;height:100vh;font-family:-apple-system,'SF Pro Display',Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#FFF}
#scene3d{position:fixed;inset:0;perspective:1600px;perspective-origin:50% 50%;overflow:hidden}
#camera{width:100%;height:100%;transform-style:preserve-3d;transition:transform 2.2s cubic-bezier(.22,1,.36,1)}
.scene-3d{position:absolute;width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none;transform-style:preserve-3d;opacity:0;transition:opacity 0.8s ease}
.scene-3d.active{opacity:1;z-index:2}
.scene-3d.exit{opacity:0;z-index:1}
.scene-3d .scene-content{width:100%;height:100%;overflow:hidden;position:relative;background:#090909;transform-style:preserve-3d;transition:all 2s cubic-bezier(.22,1,.36,1);opacity:0;transform:translateZ(-400px) scale(0.85)}
.scene-3d .scene-content.noanim{transition:none;opacity:1;transform:none}
.scene-3d.active .scene-content{opacity:1;transform:translateZ(0) scale(1)}
.scene-3d.exit .scene-content{opacity:0;transform:translateZ(-600px) scale(0.75)}

/* ===== FLOATING CARD ===== */
.float-card{position:absolute;border-radius:20px;background:#121212;border:0.5px solid rgba(255,255,255,0.06);padding:14px 18px;transform-style:preserve-3d;backface-visibility:hidden;will-change:transform}

/* ===== CONNECTING LINES SVG ===== */
.connect-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.connect-svg line,.connect-svg path{stroke:#B7FF2A;stroke-width:0.5;stroke-dasharray:2000;stroke-dashoffset:2000;opacity:0.3}
.connect-svg.animate line,.connect-svg.animate path{animation:drawLine 1.5s ease forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}

/* ===== ENTER ANIMATIONS ===== */
.float-card{opacity:0;transform:scale(0.85);transition:all 0.8s cubic-bezier(.22,1,.36,1)}
.float-card.show{opacity:1;transform:scale(1)}

/* ===== TYPING CURSOR ===== */
.typing-cursor{display:inline-block;width:2px;height:1.1em;background:#B7FF2A;margin-left:2px;vertical-align:text-bottom;animation:blink 0.8s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ===== CONFIDENCE RING ===== */
.conf-ring{width:80px;height:80px;border-radius:50%;position:relative;flex-shrink:0}
.conf-ring svg{transform:rotate(-90deg)}
.conf-ring-bg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:4}
.conf-ring-fill{fill:none;stroke:#B7FF2A;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset 1.5s cubic-bezier(.22,1,.36,1)}

/* ===== CHECK-ANIMATE ===== */
.check-item{display:flex;align-items:center;gap:10px;padding:8px 0;opacity:0;transform:translateX(-8px);transition:all 0.5s cubic-bezier(.22,1,.36,1)}
.check-item.show{opacity:1;transform:translateX(0)}
.check-dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}

/* ===== TIMELINE STEP ===== */
.tl-step{display:flex;align-items:center;gap:14px;padding:10px 0;opacity:0;transform:translateY(12px);transition:all 0.6s cubic-bezier(.22,1,.36,1)}
.tl-step.show{opacity:1;transform:translateY(0)}
.tl-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:8px;font-weight:700;transition:all 0.4s ease}
.tl-line{width:1.5px;flex:1;margin:2px 0;transition:all 0.6s ease}

/* ===== COUNT-UP ===== */
.count-num{font-size:42px;font-weight:900;letter-spacing:-0.04em;line-height:1;color:#B7FF2A}
.count-label{font-size:10px;color:#5F5F5F;font-weight:500;letter-spacing:0.02em;margin-top:3px}

/* ===== JOURNAL CARD ===== */
.j-card{background:#111;border-radius:16px;padding:10px 14px;margin-bottom:4px;border:0.5px solid rgba(255,255,255,0.04);display:flex;align-items:center;gap:10px;opacity:0;transform:translateY(10px);transition:all 0.6s cubic-bezier(.22,1,.36,1)}
.j-card.show{opacity:1;transform:translateY(0)}

/* ===== ORBIT ===== */
@keyframes orbit{0%{transform:rotate(0deg) translateX(var(--r)) rotate(0deg)}100%{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg)}}
.orbit-item{position:absolute;width:160px;height:auto;animation:orbit var(--d) linear infinite;transform-style:preserve-3d}

/* ===== REVEAL TEXT ===== */
.reveal-word{overflow:hidden;display:inline-block;line-height:1.2}
.reveal-word span{display:block;animation:revealIn 0.8s cubic-bezier(.22,1,.36,1) forwards;transform:translateY(100%)}
@keyframes revealIn{to{transform:translateY(0)}}

/* ===== GLOW / MISC ===== */
.glow-ambient{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.glow-ambient.g1{width:500px;height:500px;background:radial-gradient(circle,rgba(183,255,42,0.03),transparent 70%);top:-160px;left:-160px}
.glow-ambient.g2{width:420px;height:420px;background:radial-gradient(circle,rgba(183,255,42,0.02),transparent 70%);bottom:-140px;right:-140px}
.particles{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.p{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(183,255,42,0.3);animation:particleFloat linear infinite}
@keyframes particleFloat{0%{opacity:0;transform:translateY(0) translateX(0)}20%{opacity:0.4}80%{opacity:0.4}100%{opacity:0;transform:translateY(-80px) translateX(20px)}}
#progress{position:fixed;bottom:0;left:0;right:0;height:1.5px;background:rgba(255,255,255,0.015);z-index:999}
#progress-fill{height:100%;background:rgba(183,255,42,0.4);width:0%;transition:width 0.1s linear}
#title-overlay{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:100;font-size:8px;font-weight:500;color:rgba(183,255,42,0.12);letter-spacing:0.2em;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity 1s ease}
#title-overlay.show{opacity:1}
.scene-label{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;font-size:9px;font-weight:400;color:rgba(255,255,255,0.08);letter-spacing:0.06em;pointer-events:none;font-family:monospace;opacity:0;transition:opacity 0.6s ease}
.scene-label.show{opacity:1}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 8px rgba(183,255,42,0.1)}50%{box-shadow:0 0 25px rgba(183,255,42,0.25)}}
</style>

// 6. SEQUENCER
// ============================================================
var currentScene=0;
var isTransitioning=false;

function showScene(idx){
  if(isTransitioning)return;
  isTransitioning=true;
  console.log('showScene:',idx);

  var dbg=document.getElementById('debug');
  if(dbg)dbg.textContent='scene '+(idx+1)+'/'+scenes.length;

  document.getElementById('sceneLabel').classList.remove('show');

  var all=document.querySelectorAll('.scene-3d');

  if(idx===0){
    all.forEach(function(s){s.classList.remove('active');s.classList.remove('exit');});
    var s0=document.getElementById('scene-0');
    s0.querySelector('.scene-content').classList.add('noanim');
    s0.classList.add('active');
    requestAnimationFrame(function(){s0.querySelector('.scene-content').classList.remove('noanim');});
    // Animate scene 0 elements
    setTimeout(function(){
      document.getElementById('s0-line').style.width='120px';
    },200);
    setTimeout(function(){
      document.getElementById('s0-t1').style.opacity='1';
      setTimeout(function(){document.getElementById('s0-t2').style.opacity='1';},500);
    },600);
  }else{
    all.forEach(function(s){s.classList.remove('active');s.classList.remove('exit');});
    var prev=document.getElementById('scene-'+(idx-1));
    if(prev)prev.classList.add('exit');
  }

  var scene=document.getElementById('scene-'+idx);
  if(scene){
    requestAnimationFrame(function(){scene.classList.add('active');});
  }

  // Per-scene animations
  runScene(idx);

  var cam=document.getElementById('camera');
  var camRotations=[
    {rx:0,ry:0,tz:0},
    {rx:-4,ry:6,tz:-80},
    {rx:-2,ry:8,tz:-100},
    {rx:0,ry:0,tz:0},
    {rx:3,ry:-5,tz:-60},
    {rx:0,ry:0,tz:0},
    {rx:-2,ry:4,tz:-40},
    {rx:0,ry:0,tz:0},
    {rx:0,ry:0,tz:-80}
  ];
  var c=camRotations[idx]||{rx:0,ry:0,tz:0};
  cam.style.transform='rotateX('+c.rx+'deg) rotateY('+c.ry+'deg) translateZ('+c.tz+'px)';

  if(sceneLabels[idx]){
    var labelEl=document.getElementById('sceneLabel');
    labelEl.textContent=sceneLabels[idx];
    setTimeout(function(){labelEl.classList.add('show');},800);
  }

  var dur=scenes[idx].duration||3;
  startProgress(dur);

  isTransitioning=false;
  currentScene=idx;

  if(window._sceneTimer)clearTimeout(window._sceneTimer);
  window._sceneTimer=setTimeout(function(){
    showScene((idx+1)%scenes.length);
  },dur*1000+1500);
}

function startProgress(sec){
  var el=document.getElementById('progress-fill');
  el.style.width='0%';
  el.style.transition='none';
  requestAnimationFrame(function(){
    el.style.transition='width '+sec+'s linear';
    el.style.width='100%';
  });
}

// 7. PER-SCENE ANIMATIONS
// ============================================================
function runScene(idx){
  if(idx===1) scene1_awakening();
  else if(idx===2) scene2_connection();
  else if(idx===3) scene3_intelligence();
  else if(idx===4) scene4_signal();
  else if(idx===5) scene5_execution();
  else if(idx===6) scene6_reflection();
  else if(idx===7) scene7_weekly();
  else if(idx===8) scene8_reveal();
}

        if(el)el.classList.add('show');
      },n*400+100);
    })(i);
  }
}

function scene6_reflection(){
  var trades=mockState.journal;
  var container=document.getElementById('s6-journal');
  var html='<div style="font-size:10px;font-weight:600;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px">'+icon(I.journal,C.text2,10)+' Journal</div>';
  for(var i=0;i<trades.length;i++){
    var t=trades[i];
    var rv=t.rMultiple||0;
    var col=rv>0?'#B7FF2A':rv<0?'#FF5252':'#8E8E8E';
    html+='<div class="j-card" id="jc-'+i+'"><div style="width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;background:'+(t.direction==='BUY'?'rgba(183,255,42,0.1)':'rgba(255,82,82,0.1)')+';color:'+(t.direction==='BUY'?'#B7FF2A':'#FF5252')+'">'+(t.direction==='BUY'?'B':'S')+'</div><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:600;color:#FFF">'+t.pair+' <span style="font-size:8px;font-weight:400;color:#5F5F5F">'+t.tf+'</span></div><div style="font-size:8px;color:#5F5F5F;margin-top:1px">'+t.outcome+'</div></div><div style="font-size:13px;font-weight:800;color:'+col+';letter-spacing:-0.03em">'+(rv>0?'+':'')+rv+'R</div></div>';
  }
  container.innerHTML=html;

  for(var i=0;i<trades.length;i++){
    (function(n){
      setTimeout(function(){
        var el=document.getElementById('jc-'+n);
        if(el)el.classList.add('show');
      },n*300+100);
    })(i);
  }

  // Show chart after all trades
  setTimeout(function(){
    var chartContainer=document.getElementById('s6-chart');
    var pts=[];
    var cum=0;
    for(var i=0;i<trades.length;i++){
      cum+=(trades[i].rMultiple||0);
      pts.push(cum);
    }
    var mn=Math.min(0,Math.min.apply(null,pts)),mx=Math.max(0,Math.max.apply(null,pts)),rng=mx-mn||1;
    function py(v){return 50-((v-mn)/rng)*40;}
    function px(i2){return 20+(i2/(pts.length-1))*260;}
    var d='';
    for(var i=0;i<pts.length;i++)d+=(i===0?'M':'L')+px(i).toFixed(1)+','+py(pts[i]).toFixed(1);
    var col=cum>=0?'#B7FF2A':'#FF5252';
    chartContainer.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:8px;color:#5F5F5F;text-transform:uppercase;letter-spacing:0.05em">Equity Curve</span><span style="font-size:11px;font-weight:700;color:'+col+'">'+(cum>0?'+':'')+cum.toFixed(1)+'R</span></div>'+
      '<svg viewBox="0 0 300 55" style="width:100%;height:55px;display:block"><defs><linearGradient id="egf" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+col+'" stop-opacity="0.12"/><stop offset="100%" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs><path d="'+d+' L280,55 L20,55 Z" fill="url(#egf)"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+px(pts.length-1).toFixed(1)+'" cy="'+py(cum).toFixed(1)+'" r="3" fill="'+col+'"/></svg>';
    chartContainer.style.opacity='1';

    // Show text
    setTimeout(function(){document.getElementById('s6-text').style.opacity='1';},400);
  }, trades.length*300+500);
}

function scene7_weekly(){
  var ms=mockState.weeklyReportData.myStats;
  var targetR=ms.totalR||12.4;
  var targetWR=ms.winRate||86;
  var targetAvg=targetR/(ms.total||8);
  var targetStreak=4;

  function countUp(elId,target,duration,decimals){
    var el=document.getElementById(elId);
    var start=performance.now();
    function step(now){
      var p=Math.min(1,(now-start)/duration);
      var ease=1-Math.pow(1-p,3);
      var val=ease*target;
      el.textContent=decimals>0?val.toFixed(decimals):Math.round(val).toString();
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  setTimeout(function(){countUp('s7-r',targetR,1500,1);},200);
  setTimeout(function(){countUp('s7-wr',targetWR,1500,0);},400);
  setTimeout(function(){countUp('s7-avg',targetAvg,1500,2);},600);
  setTimeout(function(){countUp('s7-streak',targetStreak,1200,0);},800);

  // Show grade
  setTimeout(function(){document.getElementById('s7-grade').style.opacity='1';},1500);
}

function scene8_reveal(){
  // Show orbiting elements
  var orbit=document.getElementById('s8-orbit');
  var items=[
    {icon: I.dash, label:'Dashboard'},
    {icon: I.intel, label:'Intel'},
    {icon: I.target, label:'Signal'},
    {icon: I.journal, label:'Journal'},
    {icon: I.activity, label:'Report'}
  ];

  var html='';
  for(var i=0;i<items.length;i++){
    var angle=(i/items.length)*360;
    var radius=Math.min(window.innerWidth,window.innerHeight)*0.35;
    var delay=i*0.15;
    html+='<div class="orbit-item" style="--r:'+radius+'px;--d:'+(8+Math.random()*4)+'s;animation-delay:'+delay+'s;transform-origin:center center;left:50%;top:50%;margin-left:-80px;margin-top:-28px;text-align:center">'+
      '<div style="background:#121212;border-radius:16px;padding:12px 16px;border:0.5px solid rgba(255,255,255,0.04);display:inline-flex;align-items:center;gap:8px">'+
        icon(items[i].icon,'rgba(183,255,42,0.15)',14)+
        '<span style="font-size:10px;color:rgba(255,255,255,0.2)">'+items[i].label+'</span></div></div>';
  }
  orbit.innerHTML=html;
  orbit.style.opacity='1';

  // After orbit plays for a bit, collapse and show center
  setTimeout(function(){
    orbit.style.opacity='0';
    orbit.style.transition='opacity 0.8s ease';
  }, 2500);

  setTimeout(function(){
    document.getElementById('s8-center').style.opacity='1';
  }, 2800);

  // Reveal text sequentially
  setTimeout(function(){document.getElementById('s8-l1').style.opacity='1';document.getElementById('s8-l1').style.transition='opacity 0.8s ease';},3200);

  setTimeout(function(){document.getElementById('s8-brand').style.opacity='1';document.getElementById('s8-brand').style.transition='opacity 0.8s ease';},4500);
  setTimeout(function(){document.getElementById('s8-tag').style.opacity='1';},5000);
}
